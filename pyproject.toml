[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gb-da-forecast"
version = "0.1.0"
description = "Forecasting the GB hourly day-ahead (EPEX DA1 / N2EX) electricity auction price"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "requests>=2.31",
    "openpyxl>=3.1",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
notebook = ["ipykernel"]

[tool.setuptools.packages.find]
where = ["src"]
